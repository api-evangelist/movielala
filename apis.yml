name: Movielala
description: MovieLaLa Inc was a San Francisco movie-discovery and social-video startup (500 Global portfolio,
  founded 2012) best known for its GIF maker and a MovieLaLa Video Player. The only developer surface it ever
  published was a client-side JavaScript embed API for that player (a drop-in replacement for the YouTube IFrame
  API, loaded from assets-embed.movielala.com), documented in the github.com/movielala GitHub org. The company
  is now defunct — its last public code activity was 2016 and the gif-maker repo redirects to gifmaker.io. The
  movielala.com domain has lapsed and is currently repurposed by an unrelated third party (an Indonesian
  gambling site), so it no longer represents the company and is not wired as a website here. No REST/OpenAPI,
  AsyncAPI, or hosted API surface exists to enrich.
